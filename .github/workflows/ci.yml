name: SUMAQ CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  backend-testing:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        working-directory: ./backend
        env:
          SECRET_KEY: 'ci-testing-dummy-key-for-django-check'
          DEBUG: 'True'
          DB_ENGINE: 'sqlite'
        run: |
          python manage.py check

      - name: Run Pytest Test Suite (19 Tests)
        working-directory: ./backend
        env:
          SECRET_KEY: 'ci-testing-dummy-key-for-django-check'
          DEBUG: 'True'
          DB_ENGINE: 'sqlite'
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Build React 19 Distribution (Vite)
        working-directory: ./frontend
        run: |
          npm run build

  docker-validate:
    name: Docker Stack Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
