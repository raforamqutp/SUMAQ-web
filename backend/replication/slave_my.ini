# ==============================================================================
# CONFIGURACIÓN DE MYSQL SLAVE / REPLICA - SUMAQ SPA
# Ubicación típica en nodo réplica: my.cnf o my.ini (Puerto alternativo 3307)
# ==============================================================================

[mysqld]
# 1. Identificador único del servidor Réplica (debe ser distinto a 1)
server-id = 2

# 2. Habilitar Relay Log para procesamiento asíncrono
relay-log = mysql-relay-bin
log_replica_updates = 1
read_only = 1
replica_skip_errors = 1062, 1032

# 3. Base de datos a replicar
replicate_do_db = sumaq_spa

# 4. Parámetros de conexión y juego de caracteres
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
default-time-zone = '+00:00'
port = 3306
mysqlx = 0
bind-address = 0.0.0.0
datadir = "C:/Users/alexi/Downloads/PROYECTO UNI/INTEGRADOR/SUMAQ-web/backend/replication/data_slave"
