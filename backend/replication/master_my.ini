# ==============================================================================
# CONFIGURACIÓN DE MYSQL MASTER (SOURCE) - SUMAQ SPA
# Ubicación típica en XAMPP: C:\xampp\mysql\bin\my.ini (o incluir esta sección)
# ==============================================================================

[mysqld]
# 1. Identificador único del servidor Master en el clúster
server-id = 1

# 2. Habilitar registro binario (Binary Log) para replicación
log-bin = mysql-bin
binlog_format = ROW
expire_logs_days = 7
max_binlog_size = 100M

# 3. Base de datos a replicar exclusivamente
binlog_do_db = sumaq_spa

# 4. Configuración InnoDB para transacciones ACID seguras
innodb_flush_log_at_trx_commit = 1
sync_binlog = 1

# 5. Parámetros de conexión y juego de caracteres
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
default-time-zone = '+00:00'
port = 3306
bind-address = 0.0.0.0
